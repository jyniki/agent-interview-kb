name: links
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 检查外部链接
        run: python3 tools/check_links.py
